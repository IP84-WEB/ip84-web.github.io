<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Portfolio — Iacopo Pasqui</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #ffffff;
  color: #333;

  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

    .page {
      margin-left: 60px;
      margin-right: 60px;
      padding: 40px 0;
    }

    .header {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.6px;
      margin-bottom: 16px;
    }

    .line {
      height: 1px;
      background: #333;
      width: 100%;
      margin: 20px 0;
    }

    .content {
      max-width: 820px;
      font-size: 14px;
      line-height: 1.55;
    }

    .block {
      margin-bottom: 40px;
    }

    .title {
      font-weight: 500;
      margin-bottom: 8px;
    }

    .note {
      color: #777;
      margin-bottom: 12px;
    }

    input {
      border: none;
      border-bottom: 1px solid #999;
      background: transparent;
      padding: 6px 0;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      width: 220px;
      transition: border-color 0.3s ease;
    }

    input:focus {
      border-bottom: 1px solid #333;
    }

    .link {
      margin-top: 12px;
      opacity: 0;
      transform: translateY(5px);
      transition: all 0.3s ease;
    }

    .link.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .link a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
    }

    .link a:hover {
      opacity: 0.6;
    }

    .contact {
      margin-top: 40px;
      padding-top: 18px;
      border-top: 1px solid #333;
    }

    .contact a {
      text-decoration: none;
      font-weight: 600;
      color: #333;
    }

    .footer {
      margin-top: 200px;
      font-size: 14px;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0;
    }

    .left-links {
      display: flex;
      gap: 50px;
    }

    .left-links a {
      position: relative;
      text-decoration: none;
      color: #333;
      opacity: 0.72;
      transition: opacity 0.25s ease;
    }

    .left-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 1px;
      background: #333;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
    }

    .left-links a:hover,
    .left-links a.active {
      opacity: 1;
    }

    .left-links a:hover::after,
    .left-links a.active::after {
      transform: scaleX(1);
    }

    .left-links a.active {
      font-weight: 500;
    }

    .connected {
      font-weight: 500;
    }

    .copyright {
      font-size: 12px;
      color: #666;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .page {
        margin-left: 10px;
        margin-right: 10px;
        padding: 10px 0;
      }

      input {
        width: 100%;
      }

      .footer {
        margin-top: 120px;
      }

      .footer-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .left-links {
        gap: 20px;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="header">Iacopo Pasqui</div>

    <div class="line"></div>

    <div class="content">

      <div class="block">
        <div class="title">Fine Art Portfolio</div>
        <div class="note">Access restricted portfolio.</div>
        <input type="password" id="fine" placeholder="password">
        <div class="link" id="fineLink">
          <a href="INSERISCI_LINK_FINE_ART" target="_blank">open portfolio</a>
        </div>
      </div>

      <div class="block">
        <div class="title">Commercial Portfolio</div>
        <div class="note">Access restricted portfolio.</div>
        <input type="password" id="comm" placeholder="password">
        <div class="link" id="commLink">
          <a href="INSERISCI_LINK_COMMERCIAL" target="_blank">open portfolio</a>
        </div>
      </div>

      <div class="contact">
        <p>To request access:</p>
        <p>
          mail: <a href="mailto:studio@iacopopasqui.it"><strong>studio@iacopopasqui.it</strong></a>
        </p>
      </div>

    </div>

    <div class="footer">
      <div class="line"></div>

      <div class="footer-row">
        <div class="left-links">
          <a href="index.html">Home</a>
          <a href="info.html">Info</a>
          <a href="portfolio.html" class="active">Portfolio</a>
          <a href="https://instagram.com/iacopopasqui" target="_blank">Instagram</a>
          <a class="connected" href="https://www.connected-archives.com/-/galleries/photographer/iacopo-pasqui" target="_blank">Connected Archive</a>
        </div>

        <div class="copyright">© 2026 Iacopo Pasqui</div>
      </div>

      <div class="line"></div>
    </div>

  </div>

  <script>
    document.getElementById("fine").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        if (this.value === "PASSWORD_FINE") {
          document.getElementById("fineLink").classList.add("visible");
        }
      }
    });

    document.getElementById("comm").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        if (this.value === "PASSWORD_COMMERCIAL") {
          document.getElementById("commLink").classList.add("visible");
        }
      }
    });
  </script>

</body>
</html>
