<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Portfolio — Iacopo Pasqui</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .page {
      margin-left: 60px;
      margin-right: 60px;
      padding: 40px 0;
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
    }

    .header {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.6px;
      margin-bottom: 16px;
    }

    .line {
      height: 1px;
      background: #333;
      width: 100%;
      margin: 20px 0;
    }

    .line-spaced {
      display: none;
    }

    .content {
      max-width: 820px;
      font-size: 14px;
      line-height: 1.55;
    }

    .content p {
      margin: 0 0 18px 0;
    }

    .block {
      margin-bottom: 40px;
    }

    .title {
      font-weight: 500;
      margin-bottom: 8px;
    }

    .note {
      color: #777;
      margin-bottom: 12px;
    }

    input,
    textarea {
      border: none;
      border-bottom: 1px solid #999;
      background: transparent;
      padding: 6px 0;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      width: 220px;
      transition: border-color 0.3s ease;
      color: #333;
    }

    textarea {
      width: 320px;
      resize: vertical;
      min-height: 70px;
    }

    input:focus,
    textarea:focus {
      border-bottom: 1px solid #333;
    }

    button {
      margin-top: 6px;
      background: none;
      border: 1px solid #333;
      padding: 8px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #333;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    button:hover {
      background: #333;
      color: #fff;
    }

    .contact {
      margin-top: 40px;
      padding-top: 18px;
      border-top: 1px solid #333;
    }

    .contact a {
      text-decoration: none;
      font-weight: 600;
      color: #333;
    }

    .footer {
      margin-top: auto;
      font-size: 14px;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0;
    }

    .left-links {
      display: flex;
      gap: 50px;
    }

    .left-links a {
      position: relative;
      text-decoration: none;
      color: #333;
      font-weight: 400;
      opacity: 0.72;
      transition: opacity 0.25s ease;
    }

    .left-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 1px;
      background: #333;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
    }

    .left-links a:hover,
    .left-links a.active {
      opacity: 1;
    }

    .left-links a:hover::after,
    .left-links a.active::after {
      transform: scaleX(1);
    }

    .left-links a.active {
      font-weight: 500;
    }

    .connected {
      font-weight: 500;
    }

    .copyright {
      font-size: 12px;
      color: #666;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .page {
        margin-left: 10px;
        margin-right: 10px;
        padding: 10px 0;
        min-height: calc(100vh - 20px);
      }

      input,
      textarea {
        width: 100%;
      }

      .footer {
        margin-top: auto;
      }

      .footer-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .left-links {
        gap: 20px;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="header">Iacopo Pasqui</div>

    <div class="line"></div>

    <div class="content">

      <div class="block">
        <div class="title">Fine Art Portfolio</div>
        <div class="note">Access available upon request.</div>

        <form action="https://formspree.io/f/xvzlpnpe" method="POST">
          <input type="hidden" name="_subject" value="Fine Art Portfolio request">
          <input type="hidden" name="_redirect" value="https://www.iacopopasqui.it/thanks.html">
          <input type="hidden" name="portfolio" value="Fine Art Portfolio">

          <input type="text" name="name" placeholder="your name" required><br><br>
          <input type="email" name="email" placeholder="your email" required><br><br>
          <textarea name="message" placeholder="optional message"></textarea><br><br>

          <button type="submit">Request access</button>
        </form>
      </div>

      <div class="block">
        <div class="title">Commercial Portfolio</div>
        <div class="note">Access available upon request.</div>

        <form action="https://formspree.io/f/xvzlpnpe" method="POST">
          <input type="hidden" name="_subject" value="Commercial Portfolio request">
          <input type="hidden" name="_redirect" value="https://www.iacopopasqui.it/thanks.html">
          <input type="hidden" name="portfolio" value="Commercial Portfolio">

          <input type="text" name="name" placeholder="your name" required><br><br>
          <input type="email" name="email" placeholder="your email" required><br><br>
          <textarea name="message" placeholder="optional message"></textarea><br><br>

          <button type="submit">Request access</button>
        </form>
      </div>

      <div class="line-spaced"></div>

      <div class="contact">
        <p>For any additional request:</p>
        <p>
          mail: <a href="mailto:info@iacopopasqui.it"><strong>info@iacopopasqui.it</strong></a>
        </p>
      </div>

    </div>

    <div class="footer">
      <div class="line"></div>

      <div class="footer-row">
        <div class="left-links">
          <a href="index.html">Home</a>
          <a href="info.html">Info</a>
          <a href="portfolio.html" class="active">Portfolio</a>
          <a href="https://instagram.com/iacopopasqui" target="_blank">Instagram</a>
          <a class="connected" href="https://www.connected-archives.com/-/galleries/photographer/iacopo-pasqui" target="_blank">Connected Archive</a>
        </div>

        <div class="copyright">© 2026 Iacopo Pasqui</div>
      </div>

      <div class="line"></div>
    </div>

  </div>

</body>
</html>
