<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Iacopo Pasqui</title>

  <!-- FONT INTER -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #333;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 80px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .name {
      font-size: 22px;
      font-weight: 400;
    }

    .agency {
      font-size: 14px;
      font-weight: 300;
    }

    .agency a {
      text-decoration: none;
      color: #333;
    }

    .agency a:hover {
      opacity: 0.6;
    }

    .line {
      height: 1px;
      background: #333;
      width: 100%;
    }

    .container {
      margin-top: 12px;
    }

    .container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .footer {
      margin-top: 16px;
      font-size: 14px;
    }

    .footer a {
      display: inline-block;
      margin: 12px 0;
      color: #333;
      text-decoration: none;
    }

    .footer a:hover {
      opacity: 0.6;
    }

    .username {
      margin-top: 12px;
      color: #333;
      font-weight: 300;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .page {
        padding: 20px;
      }

      .name {
        font-size: 20px;
      }

      .agency {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="header">
      <div class="name">Iacopo Pasqui</div>

      <div class="agency">
        <a href="https://www.connected-archives.com/-/galleries/photographer/iacopo-pasqui" target="_blank">
          Connected Archive
        </a>
      </div>
    </div>

    <div class="line"></div>

    <div class="container">
      <img src="foto.jpg" alt="Foto">
    </div>

    <div class="footer">
      <div class="line"></div>

      <a href="https://instagram.com/iacopopasqui" target="_blank">Instagram</a>

      <div class="line"></div>

      <div class="username">@iacopopasqui</div>
    </div>

  </div>

</body>
</html>
