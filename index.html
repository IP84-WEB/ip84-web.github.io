<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Iacopo Pasqui</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #333;
    }

    .page {
      max-width: 1600px;
      margin: 0 auto;
      padding: 40px 60px;
    }

    .header {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.6px;
      margin-bottom: 16px;
    }

    .line {
      height: 1px;
      background: #333;
      width: 100%;
      margin: 20px 0;
    }

    .image-wrapper {
      margin: 20px 0;
    }

    .image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }

    .footer {
      margin-top: 24px;
      font-size: 14px;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0;
    }

    .left-links {
      display: flex;
      gap: 50px;
    }

    .left-links a {
      text-decoration: none;
      color: #333;
      font-weight: 400;
    }

    .left-links a:hover {
      opacity: 0.6;
    }

    .connected {
      font-weight: 500;
    }

    .copyright {
      font-size: 12px;
      color: #666;
      font-weight: 300;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .page {
        padding: 10px;
      }

      .header {
        font-size: 20px;
      }

      .footer-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .left-links {
        gap: 20px;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="header">Iacopo Pasqui</div>

    <div class="line"></div>

    <div class="image-wrapper">
      <img src="foto.jpg" alt="Foto">
    </div>

    <div class="footer">
      <div class="line"></div>

      <div class="footer-row">
        <div class="left-links">
          <a href="info.html">Info</a>
          <a href="https://instagram.com/iacopopasqui" target="_blank">Instagram</a>
          <a class="connected" href="https://www.connected-archives.com/-/galleries/photographer/iacopo-pasqui" target="_blank">Connected Archive</a>
        </div>

        <div class="copyright">© 2026 Iacopo Pasqui</div>
      </div>

      <div class="line"></div>
    </div>

  </div>

</body>
</html>
