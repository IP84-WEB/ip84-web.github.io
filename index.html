<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Iacopo Pasqui</title>

  <!-- FONT INTER -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #333;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 80px;
    }

    /* HEADER */
    .header {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.6px;
      margin-bottom: 16px;
    }

    .line {
      height: 1px;
      background: #333;
      width: 100%;
    }

    .container {
      margin-top: 12px;
    }

    .container img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* FOOTER */
    .footer {
      margin-top: 24px;
      font-size: 14px;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
    }

    .left-links {
      display: flex;
      gap: 50px;
    }

    .left-links a {
      text-decoration: none;
      color: #333;
      font-weight: 400;
    }

    .left-links a:hover {
      opacity: 0.6;
    }

    .connected {
      font-weight: 500;
    }

    .copyright {
      font-size: 12px;
      color: #666;
      font-weight: 300;
      opacity: 0.7;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .page {
        padding: 20px;
      }

      .header {
        font-size: 20px;
      }

      .footer-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .left-links {
        gap: 20px;
      }
    }

  </style>
</head>

<body>

  <div class="page">

    <!-- NOME -->
    <div class="header">Iacopo Pasqui</div>

    <div class="line"></div>

    <!-- FOTO -->
    <div class="container">
      <img src="foto.jpg" alt="Foto">
    </div>

    <!-- FOOTER -->
    <div class="footer">

      <div class="line"></div>

      <div class="footer-row">

        <div class="left-links">
          <a href="https://instagram.com/iacopopasqui" target="_blank">Instagram</a>

          <a class="connected" href="https://www.connected-archives.com/-/galleries/photographer/iacopo-pasqui" target="_blank">
            Connected Archive
          </a>
        </div>

        <div class="copyright">
          © 2026 Iacopo Pasqui
        </div>

      </div>

      <div class="line"></div>

    </div>

  </div>

</body>
</html>
