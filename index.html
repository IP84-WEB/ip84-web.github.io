<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Iacopo Pasqui</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #333;
      .sticky-header {
  position: sticky;
  top: 40px;
  background: #transparent;
  z-index: 10;
    }

    .page {
  margin-left: 60px;
  margin-right: 60px;
  padding: 40px 0;
    }

    .header {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.6px;
      margin-bottom: 16px;
    }

    .line {
      height: 1px;
      background: #333;
      width: 100%;
      margin: 20px 0;
    }

    .image-wrapper {
      margin: 20px 0;
    }

    .image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }

    .footer {
      margin-top: 24px;
      font-size: 14px;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0;
    }

    .left-links {
      display: flex;
      gap: 50px;
    }

    .left-links a {
      position: relative;
      text-decoration: none;
      color: #333;
      font-weight: 400;
      opacity: 0.72;
      transition: opacity 0.25s ease;
    }

    .left-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 1px;
      background: #333;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
    }

    .left-links a:hover,
    .left-links a.active {
      opacity: 1;
    }

    .left-links a:hover::after,
    .left-links a.active::after {
      transform: scaleX(1);
    }

    .left-links a.active {
      font-weight: 500;
    }

    .connected {
      font-weight: 500;
    }

    .copyright {
      font-size: 12px;
      color: #666;
      font-weight: 300;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
  .page {
    margin-left: 10px;
    margin-right: 10px;
    padding: 10px 0;
     }

      .header {
        font-size: 20px;
      }

      .footer-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .left-links {
        gap: 20px;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <div class="page">
<div class="sticky-header">
    <div class="header">Iacopo Pasqui</div>
    <div class="line">
    </div>

    <div class="image-wrapper">
      <img src="foto.jpg" alt="Foto">
    </div>

    <div class="footer">
      <div class="line"></div>

      <div class="footer-row">
        <div class="left-links">
          <a href="index.html" class="active">Home</a>
          <a href="info.html">Info</a>
          <a href="portfolio.html">Portfolio</a>
          <a href="https://instagram.com/iacopopasqui" target="_blank">Instagram</a>
          <a class="connected" href="https://www.connected-archives.com/-/galleries/photographer/iacopo-pasqui" target="_blank">Connected Archive</a>
        </div>

        <div class="copyright">© 2026 Iacopo Pasqui</div>
      </div>

      <div class="line"></div>
    </div>

  </div>

</body>
</html>
