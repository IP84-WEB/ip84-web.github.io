<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Iacopo Pasqui</title>

  <style>
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #333;
    }

    .header {
      padding: 40px;
      font-size: 22px;
    }

    .line {
      height: 1px;
      background: #333;
      margin: 0 20px;
    }

    .container {
      position: relative;
      padding: 20px;
    }

    .container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .coming {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      letter-spacing: 0px;
      color: #333;
    }

    .footer {
      margin: 20px;
      padding-top: 20px;
      border-top: 1px solid #333;
      font-size: 14px;
    }

    .footer a {
      color: #333;
      text-decoration: none;
      border-bottom: 1px solid #333;
    }

    .footer a:hover {
      opacity: 0.6;
    }

    .username {
      margin-top: 10px;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="header">Iacopo Pasqui</div>
  <div class="line"></div>

  <div class="container">
    <div class="coming">Coming soon</div>
    <img src="foto.jpg" alt="Foto">
  </div>

  <div class="footer">
    <a href="https://instagram.com/iacopopasqui" target="_blank">Instagram</a>
    <div class="username">@iacopopasqui</div>
  </div>

</body>
</html>
