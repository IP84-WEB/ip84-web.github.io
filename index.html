<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Iacopo Pasqui</title>

  <style>
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #333;
    }

    /* CONTENITORE CENTRATO */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 80px;
    }

    .header {
      font-size: 22px;
      margin-bottom: 16px;
    }

    .line {
      height: 1px;
      background: #333;
      width: 100%;
    }

    .container {
      position: relative;
      margin-top: 12px;
    }

    .container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .coming {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #333;
    }

    .footer {
      margin-top: 16px;
      font-size: 14px;
    }

    .footer a {
      display: inline-block;
      margin: 12px 0;
      color: #333;
      text-decoration: none;
    }

    .footer a:hover {
      opacity: 0.6;
    }

    .username {
      margin-top: 12px;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="header">Iacopo Pasqui</div>

    <div class="line"></div>

    <div class="container">
      <div class="coming">COMING SOON</div>
      <img src="foto.jpg" alt="Foto">
    </div>

    <div class="footer">
      <div class="line"></div>

      <a href="https://instagram.com/iacopopasqui" target="_blank">Instagram</a>

      <div class="line"></div>

      <div class="username">@iacopopasqui</div>
    </div>

  </div>

</body>
</html>
