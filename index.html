<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Iacopo Pasqui</title>

  <style>
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #333;
    }

    .header {
      padding: 20px;
      font-size: 22px;
    }

    /* LINEA SOPRA (HEADER) */
    .line-top {
      height: 1px;
      background: #333;
      margin: 20px 20px 30px 20px;
    }

    /* LINEE SOTTO (FOOTER) */
    .line {
      height: 1px;
      background: #333;
      margin: 10px 20px;
    }

    .container {
      position: relative;
      padding: 20px;
    }

    .container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .coming {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      letter-spacing: 1px;
      color: #333;
      text-transform: uppercase;
    }

    .footer {
      margin: 40px 20px;
      font-size: 14px;
    }

    .footer a {
      display: inline-block;
      margin: 10px 0;
      color: #333;
      text-decoration: none;
    }

    .footer a:hover {
      opacity: 0.6;
    }

    .username {
      margin-top: 10px;
      color: #333;
    }
  </style>
</head>

<body>

  <!-- NOME -->
  <div class="header">Iacopo Pasqui</div>

  <!-- LINEA SOPRA -->
  <div class="line-top"></div>

  <!-- FOTO -->
  <div class="container">
    <div class="coming">COMING SOON</div>
    <img src="foto.jpg" alt="Foto">
  </div>

  <!-- FOOTER -->
  <div class="footer">

    <div class="line"></div>

    <a href="https://instagram.com/iacopopasqui" target="_blank">Instagram</a>

    <div class="line"></div>

    <div class="username">@iacopopasqui</div>

  </div>

</body>
</html>
