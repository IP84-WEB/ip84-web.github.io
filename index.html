<!DOCTYPE html>
<html lang="it">
<head>

  <title>Iacopo Pasqui</title>

  <style>
    body {

      font-family: Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #333;
    }

    .header {
      padding: 20px;
      font-size: 22px;
    }

    .line {
      height: 1px;
      background: #333;
      margin: 0 20px;
    }

    .container {
      position: relative;
      padding: 20px;
    }

    .container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .coming {
  position: absolute;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 16px;
  letter-spacing: 1px;
  color: #333;
  text-transform: uppercase;
    }
    .footer {
      margin: 20px;
      padding-top: 20px;
      border-top: 1px solid #333;
      font-size: 14px;
    }

    .footer a {
      color: #333;
      text-decoration: none;
      border-bottom: 1px solid #333;
    }

    .footer a:hover {
      opacity: 0.6;
    }

    .username {
      margin-top: 10px;
      color: #333;
    }
  </style>
  .footer {
  margin: 20px;
  font-size: 14px;
}

.footer a {
  display: inline-block;
  margin: 10px 0;
  color: #333;
  text-decoration: none;
}

.username {
  margin-top: 10px;
  color: #333;
}
</head>

<body>

  <div class="header">Iacopo Pasqui</div>
