<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>L’Età difficile — Iacopo Pasqui</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>

    body {
      margin: 0;
      background: #fff;
      color: #333;
      font-family: 'Inter', sans-serif;
    }

    .page {
      margin-left: 60px;
      margin-right: 60px;
      padding: 40px 0;
    }

    .header {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.6px;
      margin-bottom: 16px;
      text-shadow: 0 0 6px rgba(255,255,255,0.6);
    }

    .line {
      height: 1px;
      background: #333;
      width: 100%;
      margin: 20px 0;
    }

    .project-title {
      margin-top: 60px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 500;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 50px 40px;
      margin-top: 40px;
    }

    .item img {
      width: 100%;
      height: auto;
      display: block;
    }

    .code {
      margin-top: 8px;
      font-size: 12px;
      color: #777;
      letter-spacing: 0.3px;
    }

    .footer {
      margin-top: 80px;
      font-size: 14px;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0;
    }

    .left-links {
      display: flex;
      gap: 50px;
    }

    .left-links a {
      position: relative;
      text-decoration: none;
      color: #333;
      font-weight: 400;
      opacity: 0.72;
      transition: opacity 0.25s ease;
    }

    .left-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 1px;
      background: #333;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
    }

    .left-links a:hover,
    .left-links a.active {
      opacity: 1;
    }

    .left-links a:hover::after,
    .left-links a.active::after {
      transform: scaleX(1);
    }

    .left-links a.active {
      font-weight: 500;
    }

    .connected {
      font-weight: 500;
    }

    .copyright {
      font-size: 12px;
      color: #666;
      opacity: 0.7;
      font-weight: 300;
    }

    @media (max-width: 768px) {

      .page {
        margin-left: 10px;
        margin-right: 10px;
        padding: 10px 0;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 36px;
      }

      .footer-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .left-links {
        gap: 20px;
        flex-wrap: wrap;
      }

    }

  </style>
</head>

<body>

  <div class="page">

    <div class="header">Iacopo Pasqui</div>
    <div class="line"></div>

    <div class="project-title">L’Età difficile</div>

    <div class="gallery">

      <div class="item">
        <img src="archive/eta-difficile/ED_001.jpg" alt="ED_001">
        <div class="code">ED_001</div>
      </div>

      <div class="item">
        <img src="archive/eta-difficile/ED_002.jpg" alt="ED_002">
        <div class="code">ED_002</div>
      </div>

      <div class="item">
        <img src="archive/eta-difficile/ED_003.jpg" alt="ED_003">
        <div class="code">ED_003</div>
      </div>

      <div class="item">
        <img src="archive/eta-difficile/ED_004.jpg" alt="ED_004">
        <div class="code">ED_004</div>
      </div>

      <div class="item">
        <img src="archive/eta-difficile/ED_005.jpg" alt="ED_005">
        <div class="code">ED_005</div>
      </div>

    </div>

    <div class="footer">

      <div class="line"></div>

      <div class="footer-row">

        <div class="left-links">
          <a href="index.html">Home</a>
          <a href="info.html">Info</a>
          <a href="portfolio.html">Portfolio</a>
          <a href="archive.html" class="active">Archive</a>
          <a href="https://instagram.com/iacopopasqui" target="_blank">Instagram</a>

          <a
            class="connected"
            href="https://www.connected-archives.com/-/galleries/photographer/iacopo-pasqui"
            target="_blank">
            Connected Archive
          </a>
        </div>

        <div class="copyright">
          © 2026 Iacopo Pasqui
        </div>

      </div>

      <div class="line"></div>

    </div>

  </div>

</body>
</html>
