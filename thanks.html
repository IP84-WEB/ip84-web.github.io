<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Request sent — Iacopo Pasqui</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .page {
      margin-left: 60px;
      margin-right: 60px;
      padding: 40px 0;
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
    }

    .header {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.6px;
      margin-bottom: 16px;
    }

    .line {
      height: 1px;
      background: #333;
      width: 100%;
      margin: 20px 0;
    }

    .content {
      max-width: 820px;
      font-size: 14px;
      line-height: 1.55;
    }

    .message {
      margin-top: 20px;
    }

    .message p {
      margin-bottom: 14px;
    }

    .back {
      margin-top: 30px;
    }

    .back a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
      border-bottom: 1px solid #333;
      padding-bottom: 2px;
      transition: opacity 0.25s ease;
    }

    .back a:hover {
      opacity: 0.6;
    }

    .footer {
      margin-top: auto;
      font-size: 14px;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0;
    }

    .left-links {
      display: flex;
      gap: 50px;
    }

    .left-links a {
      text-decoration: none;
      color: #333;
      opacity: 0.72;
    }

    .left-links a.active {
      opacity: 1;
      font-weight: 500;
    }

    .copyright {
      font-size: 12px;
      color: #666;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .page {
        margin-left: 10px;
        margin-right: 10px;
        padding: 10px 0;
      }

      .footer-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .left-links {
        gap: 20px;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="header">Iacopo Pasqui</div>

    <div class="line"></div>

    <div class="content">

      <div class="message">
        <p><strong>Request successfully sent.</strong></p>
        <p>I will get back to you shortly with access to the requested portfolio.</p>
        <p>Thank you for your interest.</p>
      </div>

      <div class="back">
        <a href="portfolio.html">Back to portfolio</a>
      </div>

    </div>

    <div class="footer">
      <div class="line"></div>

      <div class="footer-row">
        <div class="left-links">
          <a href="index.html">Home</a>
          <a href="info.html">Info</a>
          <a href="portfolio.html">Portfolio</a>
          <a href="https://instagram.com/iacopopasqui" target="_blank">Instagram</a>
        </div>

        <div class="copyright">© 2026 Iacopo Pasqui</div>
      </div>

      <div class="line"></div>
    </div>

  </div>

</body>
</html>
